name: hadoop3-lab

x-hadoop-service: &hadoop-service
  restart: "no"
  networks:
    - hadoop
  volumes:
    - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
    - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro

services:
  namenode:
    <<: *hadoop-service
    image: apache/hadoop:3.5.0
    hostname: namenode
    user: "0:0"
    command:
      - bash
      - -c
      - |
        chown -R hadoop:users /data/namenode
        if [[ ! -f /data/namenode/current/VERSION ]]; then
          sudo -E -u hadoop /opt/hadoop/bin/hdfs namenode -format -force
        fi
        exec sudo -E -u hadoop /opt/hadoop/bin/hdfs namenode
    ports:
      - "9870:9870"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - namenode-data:/data/namenode
    healthcheck:
      test: ["CMD-SHELL", "sudo -E -u hadoop /opt/hadoop/bin/hdfs dfsadmin -safemode get >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  datanode:
    <<: *hadoop-service
    image: apache/hadoop:3.5.0
    hostname: datanode
    user: "0:0"
    command:
      - bash
      - -c
      - |
        chown -R hadoop:users /data/datanode
        exec sudo -E -u hadoop /opt/hadoop/bin/hdfs datanode
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - datanode-data:/data/datanode
    healthcheck:
      test: ["CMD-SHELL", "sudo -E -u hadoop /opt/hadoop/bin/hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  resourcemanager:
    <<: *hadoop-service
    image: apache/hadoop:3.5.0
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "yarn node -list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  nodemanager:
    <<: *hadoop-service
    image: apache/hadoop:3.5.0
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on:
      resourcemanager:
        condition: service_healthy
      datanode:
        condition: service_healthy
    ports:
      - "8042:8042"
    healthcheck:
      test: ["CMD-SHELL", "yarn node -list 2>/dev/null | grep -q 'RUNNING'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  historyserver:
    <<: *hadoop-service
    image: apache/hadoop:3.5.0
    hostname: historyserver
    command: ["mapred", "historyserver"]
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
    ports:
      - "19888:19888"

volumes:
  namenode-data:
  datanode-data:

networks:
  hadoop:
